name: Image

# Builds this stack's image for BOTH architectures and publishes a multi-arch tag.
#
# ─── GPU stack: adapted from the template default ────────────────────────────────
# This image is very large (a cu128 torch/CUDA stack plus ~8.8 GiB of baked
# TotalSegmentator weights across 42 datasets), so it follows the template's own
# GPU guidance rather than the CPU default:
#   * pushes directly instead of `load: true` — loading materialises the image a
#     second time on the runner disk, which does not fit;
#   * uses a registry build cache with mode=min, not the GHA cache (capped ~10 GB);
#   * verifies the label and architecture registry-side via `buildx imagetools`,
#     which reads the manifest without pulling the layers.
# The consequence is that the tool-registration smoke test cannot run here — see the
# note on that step below.
# ─────────────────────────────────────────────────────────────────────────────────
#
# On push to main: build on a NATIVE runner per architecture, smoke-test each
# natively, push arch-suffixed tags, then merge them into a multi-arch manifest list
# so ghcr.io/medmcp/<stack>:main resolves per-arch.
# On pull_request / workflow_dispatch: build + smoke-test both arches, no push.
#
# Both architectures are REQUIRED, not optional: arm64 is a first-class target
# (DGX Spark and similar), and the medmcp core refuses to install a stack image
# built for a foreign architecture (medmcp#97) rather than letting it fail later
# with "exec format error". An amd64-only stack is simply uninstallable there.
#
# Each arch builds natively — do NOT collapse this into a single buildx
# --platform linux/amd64,linux/arm64 build. QEMU is far too slow for CUDA/torch
# compiles, and it puts both architectures on one runner's disk. See medmcp#95.
#
# FROM ghcr.io/medmcp/base — the base package must grant this repo read access
# (base package settings -> Manage Actions access).
#
# NOTE: ubuntu-24.04-arm is free for public repos; private repos need a paid Team
# or Enterprise plan. Without one, swap that runner for a self-hosted aarch64 one.
# Building this image is expensive — two native runners, a multi-gigabyte CUDA/torch
# install and ~9.6 GB of weights per arch — so it only runs when something that can
# actually change the image changes. A README or test-only commit does not rebuild it,
# which also means :main keeps pointing at the last commit that genuinely produced it.
on:
  push:
    branches: [main]
    # Kept in step with the pull_request list below by hand: GitHub Actions does not
    # support YAML anchors, so the duplication is unavoidable.
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/**'
      - '.github/workflows/images.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/**'
      - '.github/workflows/images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Two merges landing close together otherwise race: both runs push the bare
# :main tag, and whichever finishes LAST wins it — which is the run that started
# FIRST if it happens to be slower, leaving :main built from the older commit
# with nothing failing and nothing in the logs to say so (medmcp#109).
#
# Queue rather than cancel on main: cancelling fixes the ordering too, but a
# superseded commit would never publish its :<sha> image, and those are what a
# rollback pins to. Pull requests do cancel — a superseded PR build has nothing
# to publish and is only spending runner time.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CHANGE ME: your stack's short name, i.e. ghcr.io/medmcp/<STACK>
  STACK: totalsegmentator

jobs:
  image:
    # Dependency bumps touch uv.lock, so they match the path filter above and would
    # otherwise spend two full image builds per bot PR. CI already type-checks and
    # tests the bump, and the image is rebuilt on merge to main anyway.
    if: github.actor != 'dependabot[bot]'
    runs-on: ${{ matrix.runner }}
    strategy:
      # Don't cancel the sibling arch on failure — a broken arm64 build should
      # still leave a diagnosable amd64 run, and vice versa.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      # Record what this runner actually has, so a build that dies with no failing
      # step still leaves the resource picture on record next to the failure.
      - name: Runner resources
        run: |
          echo "arch: $(uname -m)  cores: $(nproc)"
          free -h || true
          df -h / | tail -1
      # Hosted runners ship ~25 GB of preinstalled toolchains. This image is larger
      # than any other stack's (cu128 torch plus ~8.8 GiB of baked weights) and the
      # export-for-push needs a lot of free space, so reclaim aggressively — the
      # default dotnet/android/toolcache sweep is not enough for medmcp-neuro-core
      # and this is bigger still.
      - name: Free disk space
        run: |
          echo "before:"; df -h /
          sudo rm -rf \
            /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/az \
            /usr/local/share/powershell /usr/share/miniconda /usr/local/graalvm \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune -af || true
          sudo apt-get clean || true
          echo "after:"; df -h /
      - uses: docker/setup-buildx-action@v4
      # Login on every event — needed to pull the private base, even for PR builds.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build and load locally so the exact image is smoke-tested before pushing.
      # Arch-suffixed tags are an internal handoff to the merge job — nothing
      # outside this workflow should consume them.
      - uses: docker/build-push-action@v7
        env:
          # Stream progress: a runner that dies mid-build (disk, OOM) otherwise
          # produces no log at all, which makes it undiagnosable.
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            BASE_IMAGE=ghcr.io/medmcp/base:main
          tags: |
            ghcr.io/medmcp/${{ env.STACK }}:${{ github.sha }}-${{ matrix.arch }}
            ghcr.io/medmcp/${{ env.STACK }}:main-${{ matrix.arch }}
          # A dedicated registry ref with mode=min, matching medmcp-neuro-core: the
          # GHA cache is capped around 10 GB and this image is far past that, and
          # mode=max exports a second copy of every layer onto the runner disk. Keeping
          # the cache in the same GHCR repository means the blobs are shared with the
          # image rather than duplicated. A missing ref is a warning, not a failure,
          # so the first build simply populates it.
          #
          # The weight-baking layer is the expensive one (~8.8 GiB of downloads), and
          # its cache key is the source copy above it — so any change that leaves
          # src/ alone reuses it instead of re-downloading 42 archives.
          cache-from: type=registry,ref=ghcr.io/medmcp/${{ env.STACK }}:buildcache-${{ matrix.arch }}
          # Only a push can write the cache; a PR build has nothing to export.
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref=ghcr.io/medmcp/{0}:buildcache-{1},mode=min', env.STACK, matrix.arch) || '' }}
      # NOTE: the template's in-CI tool-registration smoke test is deliberately absent.
      # It needs `load: true`, which this image is too large for. The import risk it
      # covers — an arm64-only failure from a dependency with no aarch64 wheel — is
      # instead covered up front: every dependency in the closure resolves to a
      # pure-Python or linux-aarch64 wheel (nothing compiles from source on aarch64),
      # and `just check` exercises server start-up and tool registration on every PR.
      # If a way to smoke-test a pushed image cheaply appears, add it back here.
      #
      # The discovery label must parse — the core reads it to build the launch recipe,
      # and a malformed label makes the stack uninstallable. Read registry-side so it
      # costs a manifest fetch rather than a multi-gigabyte pull.
      - name: Check stack label
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/medmcp/${{ env.STACK }}:main-${{ matrix.arch }}" \
            --format '{{ json .Image.Config.Labels }}' | tee /tmp/labels.json
          python -c "
          import json
          labels = json.load(open('/tmp/labels.json'))
          stack = json.loads(labels['org.medmcp.stack'])
          assert stack['name'] == 'medmcp-totalsegmentator', stack
          assert stack['gpu'] is True, stack
          print('stack label ok:', stack)
          "
      # Verify the leg really built the architecture it claims — a mislabelled leg
      # would produce a manifest list uninstallable on one platform.
      - name: Check image architecture
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          got=$(docker buildx imagetools inspect \
                  "ghcr.io/medmcp/${{ env.STACK }}:main-${{ matrix.arch }}" \
                  --format '{{.Image.Platform.Architecture}}')
          echo "pushed: $got, expected: ${{ matrix.arch }}"
          [ "$got" = "${{ matrix.arch }}" ] \
            || { echo "::error::image is $got, expected ${{ matrix.arch }}"; exit 1; }
  # Runs once, after BOTH arches have pushed. Merging the per-arch images into a
  # manifest list is what makes the bare tag multi-arch; without this job the
  # suffixed tags exist but ghcr.io/medmcp/<stack>:main would not.
  merge:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge arch tags into multi-arch manifest lists
        run: |
          for tag in "${{ github.sha }}" main; do
            docker buildx imagetools create -t "ghcr.io/medmcp/${{ env.STACK }}:$tag" \
              "ghcr.io/medmcp/${{ env.STACK }}:$tag-amd64" \
              "ghcr.io/medmcp/${{ env.STACK }}:$tag-arm64"
          done
      - name: Verify both platforms resolve
        run: |
          insp=$(docker buildx imagetools inspect "ghcr.io/medmcp/${{ env.STACK }}:main")
          echo "$insp"
          for plat in linux/amd64 linux/arm64; do
            echo "$insp" | grep -q "$plat" \
              || { echo "::error::${{ env.STACK }}:main is missing $plat"; exit 1; }
          done
          echo "both platforms present"

# ─── GPU stacks ──────────────────────────────────────────────────────────────────
# Set "gpu": true in the Dockerfile's org.medmcp.stack label; the core then adds
# --device nvidia.com/gpu=… at launch. GPU images are large, so you will likely want
# to drop the cache-from/cache-to lines (they exceed the Actions cache cap and fill
# the runner disk) and switch the build step to push directly rather than
# load + smoke-test, since a CUDA image may not run on a GPU-less runner.
#
# Watch the arm64 leg: several scientific wheels are x86_64-only on Linux and fall
# back to a source build. Known cases — antspyx (no aarch64 wheel for 0.5+),
# scikit-misc (none in any release), triton (x86_64 only; the cu128 torch wheels
# declare it without an arch marker, so pin one via [tool.uv] override-dependencies).
# Add a build toolchain gated on arm64 when this happens; see medmcp-neuro-core#19
# and medmcp-cohort#6 for worked examples.
# ─────────────────────────────────────────────────────────────────────────────────
